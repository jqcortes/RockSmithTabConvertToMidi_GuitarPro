[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "band-score-to-midi"
version = "0.1.0"
description = "バンドスコア（ギター楽譜 PDF/PNG）を MIDI Type 1 に自動変換するローカル CLI パイプライン"
requires-python = ">=3.11"
dependencies = [
    "music21>=9.0,<10.0",
    "opencv-python>=4.0,<5.0",
    "pillow>=10.0,<11.0",
    "pdf2image>=1.16,<2.0",
    "PyYAML>=6.0,<7.0",
    "lxml>=4.0,<6.0",
    "mido>=1.3,<2.0",
    "structlog>=24.0",
]

[project.scripts]
band-score-to-midi = "pipeline.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "types-pillow",
    "types-PyYAML",
    "types-lxml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# ruff (linter / formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]
