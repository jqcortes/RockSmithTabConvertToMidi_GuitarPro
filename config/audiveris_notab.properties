[DEFAULT]
# TAB 検出をオフにして五線譜モードのみで実行
audiveris.jar = "C:\Program Files\Audiveris\app\audiveris.jar"
audiveris.timeout = 300

# ── TAB 譜を DISABLED に ──────────────────────────────────────────────────────
# TAB 誤認識が ノート落ちの原因の可能性あり → オフにして五線譜に集中
audiveris.option.org.audiveris.omr.sheet.ProcessingSwitches.sixStringTablatures = false
audiveris.option.org.audiveris.omr.sheet.ProcessingSwitches.fourStringTablatures = false

# ── ギター奏法記号 ────────────────────────────────────────────────────────────
audiveris.option.org.audiveris.omr.sheet.ProcessingSwitches.fingerings = true
audiveris.option.org.audiveris.omr.sheet.ProcessingSwitches.pluckings = true
audiveris.option.org.audiveris.omr.sheet.ProcessingSwitches.tremolos = true

# ── 一般音楽記号 ─────────────────────────────────────────────────────────────
audiveris.option.org.audiveris.omr.sheet.ProcessingSwitches.articulations = true
audiveris.option.org.audiveris.omr.sheet.ProcessingSwitches.chordNames = true
audiveris.option.org.audiveris.omr.sheet.ProcessingSwitches.smallHeads = true
audiveris.option.org.audiveris.omr.sheet.ProcessingSwitches.dynamicsAboveStaff = true
audiveris.option.org.audiveris.omr.sheet.ProcessingSwitches.dynamicsBelowStaff = true

# ── 品質チューニング ─────────────────────────────────────────────────────────
# minGrade を下げてより多くのノートをキャッチ（0.35 → 0.2）
audiveris.option.org.audiveris.omr.sig.inter.AbstractInter.minGrade = 0.2
audiveris.option.org.audiveris.omr.util.OmrExecutors.corePoolSize = 4
audiveris.option.org.audiveris.omr.text.tesseract.TesseractOCR.language = eng
